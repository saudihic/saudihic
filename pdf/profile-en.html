<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corporate Profile — PDF</title><style>
:root{--bg:#f3f1eb;--ink:#302e2e;--green:#005340;--line:#d8d0c4;--gold:#d7b56d}
*{box-sizing:border-box}
html,body{margin:0;background:#d9d9d9;color:var(--ink);font-family:Arial,Tahoma,sans-serif}
.toolbar{position:sticky;top:0;z-index:10;background:#111827;color:white;padding:12px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.toolbar button,.toolbar a{background:var(--gold);color:#111;border:0;border-radius:999px;padding:10px 14px;font-weight:800;text-decoration:none;cursor:pointer}
.book{padding:20px 0}
.page{width:210mm;min-height:297mm;margin:0 auto 18px;background:var(--bg);padding:17mm;position:relative;box-shadow:0 18px 50px rgba(0,0,0,.18);break-after:page;overflow:hidden}
.cover{background:linear-gradient(135deg,#005340,#302e2e);color:white;display:flex;flex-direction:column;justify-content:space-between}
.logo{max-width:155px;max-height:70px;object-fit:contain;margin-bottom:30px}
.kicker{font-size:13px;color:var(--green);font-weight:900;margin-bottom:8px}
.cover .kicker{color:#d7b56d}
h1{font-size:39px;line-height:1.15;margin:0 0 16px}
h2{font-size:28px;line-height:1.25;margin:0 0 12px;color:var(--ink)}
p{font-size:14px;line-height:1.85;margin:0 0 12px;color:#444}
.cover p{color:#eef2f0;font-size:17px;max-width:640px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.badge{background:var(--green);color:white;padding:7px 11px;border-radius:999px;font-size:12px}
.cover .badge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.68);padding:15px;break-inside:avoid}
.card h3{font-size:17px;margin:0 0 8px;color:var(--green)}
.hero-img{width:100%;height:88mm;object-fit:cover;border-radius:18px;margin:12px 0 16px;border:1px solid var(--line)}
.list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.item{border-bottom:1px solid var(--line);padding:10px 0;font-size:14px}
.clients{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.client{height:34mm;border:1px solid var(--line);border-radius:14px;background:white;display:flex;align-items:center;justify-content:center;padding:10px}
.client img{max-width:100%;max-height:100%;object-fit:contain}
.footer{position:absolute;left:17mm;right:17mm;bottom:10mm;border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;font-size:11px;color:#777}
[dir="rtl"] body,[dir="rtl"] .page{font-family:Tahoma,Arial,sans-serif}
@page{size:A4;margin:0}
@media print{html,body{background:white}.toolbar{display:none}.book{padding:0}.page{box-shadow:none;margin:0;width:210mm;min-height:297mm;page-break-after:always}.card,.item,.client{break-inside:avoid}}
</style></head><body>
<div class="toolbar"><strong>Corporate Profile — PDF</strong><div><a href="/profile/">Back to Profile</a><button onclick="window.print()">Download PDF</button></div></div>
<div class="book" id="book"></div>
<script>
async function loadContent(){ const r=await fetch('/api/content',{cache:'no-store'}); return await r.json(); }
function tx(d,p,k,f=''){return d?.pages?.[p]?.texts?.[k]||f}
function im(d,p,k,f=''){return d?.pages?.[p]?.images?.[k]?.src||f}
function foot(n,total){return `<div class="footer"><span>Horizon Integration</span><span>${n} / ${total}</span></div>`}

const P='profile_en';
const K={'logo': 'profile_en_image_001', 'hero': 'profile_en_image_003', 'ops': 'profile_en_image_013', 'cover_k': 'profile_en_text_010', 'cover_h1': 'profile_en_text_011', 'cover_h2': 'profile_en_text_012', 'cover_p': 'profile_en_text_014', 'about_k': 'profile_en_text_023', 'about_h': 'profile_en_text_024', 'about_p1': 'profile_en_text_025', 'about_p2': 'profile_en_text_026', 'svc_k': 'profile_en_text_034', 'svc_h': 'profile_en_text_035', 'svc_p': 'profile_en_text_033', 'asphalt_k': 'profile_en_text_049', 'asphalt_h': 'profile_en_text_050', 'asphalt_p': 'profile_en_text_051', 'workflow_p': 'profile_en_text_062', 'mat_k': 'profile_en_text_068', 'mat_h': 'profile_en_text_069', 'mat_p': 'profile_en_text_070', 'fleet_k': 'profile_en_text_101', 'fleet_h': 'profile_en_text_102', 'fleet_p': 'profile_en_text_103', 'clients_k': 'profile_en_text_127', 'clients_h': 'profile_en_text_128', 'clients_p': 'profile_en_text_129', 'close_h': 'profile_en_text_131', 'close_p': 'profile_en_text_132'};
const services=[('profile_en_text_037', 'profile_en_text_038'), ('profile_en_text_039', 'profile_en_text_040'), ('profile_en_text_041', 'profile_en_text_042'), ('profile_en_text_045', 'profile_en_text_046')];
const workflow=['profile_en_text_063', 'profile_en_text_064', 'profile_en_text_065', 'profile_en_text_066', 'profile_en_text_067'];
const materials=[('profile_en_text_071', 'profile_en_text_073'), ('profile_en_text_074', 'profile_en_text_076'), ('profile_en_text_077', 'profile_en_text_079'), ('profile_en_text_080', 'profile_en_text_082')];
const fleet=[('profile_en_text_105', 'profile_en_text_106'), ('profile_en_text_108', 'profile_en_text_109'), ('profile_en_text_111', 'profile_en_text_112'), ('profile_en_text_114', 'profile_en_text_115')];
const clients=['profile_en_image_014', 'profile_en_image_015', 'profile_en_image_016', 'profile_en_image_017', 'profile_en_image_018', 'profile_en_image_019', 'profile_en_image_020', 'profile_en_image_021'];
function cards(d,arr){return arr.map(x=>`<div class="card"><h3>${tx(d,P,x[0])}</h3><p>${tx(d,P,x[1])}</p></div>`).join('')}
function list(d,arr){return arr.map(k=>`<div class="item">${tx(d,P,k)}</div>`).join('')}
function render(d){
 const logo=im(d,P,K.logo), hero=im(d,P,K.hero), ops=im(d,P,K.ops);
 document.getElementById('book').innerHTML=`
<section class="page cover"><div><img class="logo" src="${logo}"><div class="kicker">${tx(d,P,K.cover_k)}</div><h1>${tx(d,P,K.cover_h1)}<br>${tx(d,P,K.cover_h2)}</h1><p>${tx(d,P,K.cover_p)}</p><div class="badges"><span class="badge">Infrastructure</span><span class="badge">Roads</span><span class="badge">Asphalt</span><span class="badge">Drainage</span></div></div><div>www.saudihic.com</div></section>
<section class="page"><div class="kicker">${tx(d,P,K.about_k)}</div><h2>${tx(d,P,K.about_h)}</h2><p>${tx(d,P,K.about_p1)}</p><p>${tx(d,P,K.about_p2)}</p>${hero?`<img class="hero-img" src="${hero}">`:''}${foot(2,7)}</section>
<section class="page"><div class="kicker">${tx(d,P,K.svc_k)}</div><h2>${tx(d,P,K.svc_h)}</h2><p>${tx(d,P,K.svc_p)}</p><div class="grid">${cards(d,services)}</div>${foot(3,7)}</section>
<section class="page"><div class="kicker">${tx(d,P,K.asphalt_k)}</div><h2>${tx(d,P,K.asphalt_h)}</h2><p>${tx(d,P,K.asphalt_p)}</p><div class="list">${list(d,workflow)}</div><p style="margin-top:18px">${tx(d,P,K.workflow_p)}</p>${foot(4,7)}</section>
<section class="page"><div class="kicker">${tx(d,P,K.mat_k)}</div><h2>${tx(d,P,K.mat_h)}</h2><p>${tx(d,P,K.mat_p)}</p><div class="grid">${cards(d,materials)}</div>${foot(5,7)}</section>
<section class="page"><div class="kicker">${tx(d,P,K.fleet_k)}</div><h2>${tx(d,P,K.fleet_h)}</h2><p>${tx(d,P,K.fleet_p)}</p>${ops?`<img class="hero-img" src="${ops}">`:''}<div class="grid">${cards(d,fleet)}</div>${foot(6,7)}</section>
<section class="page"><div class="kicker">${tx(d,P,K.clients_k)}</div><h2>${tx(d,P,K.clients_h)}</h2><p>${tx(d,P,K.clients_p)}</p><div class="clients">${clients.map(k=>`<div class="client"><img src="${im(d,P,k)}"></div>`).join('')}</div><h2 style="margin-top:28px">${tx(d,P,K.close_h)}</h2><p>${tx(d,P,K.close_p)}</p>${foot(7,7)}</section>`;}
loadContent().then(render).catch(e=>document.getElementById('book').innerHTML='<section class="page"><h2>Content load failed</h2><p>'+e.message+'</p></section>');
</script></body></html>
