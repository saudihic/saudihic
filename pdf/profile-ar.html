<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>البروفايل المؤسسي — PDF</title><style>
:root{--bg:#f3f1eb;--ink:#302e2e;--green:#005340;--line:#d8d0c4;--gold:#d7b56d}
*{box-sizing:border-box}
html,body{margin:0;background:#d9d9d9;color:var(--ink);font-family:Arial,Tahoma,sans-serif}
.toolbar{position:sticky;top:0;z-index:10;background:#111827;color:white;padding:12px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.toolbar button,.toolbar a{background:var(--gold);color:#111;border:0;border-radius:999px;padding:10px 14px;font-weight:800;text-decoration:none;cursor:pointer}
.book{padding:18px 0}
.page{width:297mm;height:210mm;margin:0 auto 16px;background:var(--bg);padding:15mm 17mm;position:relative;box-shadow:0 16px 45px rgba(0,0,0,.18);overflow:hidden;break-after:page}
.cover{background:linear-gradient(135deg,#005340,#302e2e);color:white;display:flex;flex-direction:column;justify-content:space-between}
.logo{max-width:150px;max-height:68px;object-fit:contain;margin-bottom:18px}
.kicker{font-size:13px;color:var(--green);font-weight:900;margin-bottom:7px}
.cover .kicker{color:#d7b56d}
h1{font-size:38px;line-height:1.18;margin:0 0 12px}
h2{font-size:29px;line-height:1.25;margin:0 0 10px;color:var(--ink)}
p{font-size:14px;line-height:1.8;margin:0 0 10px;color:#444}
.cover p{color:#eef2f0;font-size:17px;max-width:680px}
.row{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;align-items:start}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.68);padding:13px;break-inside:avoid}
.card h3{font-size:16px;margin:0 0 6px;color:var(--green)}
.hero-img{width:100%;height:120mm;object-fit:cover;border-radius:18px;border:1px solid var(--line)}
.small-img{width:100%;height:82mm;object-fit:cover;border-radius:18px;border:1px solid var(--line)}
.list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.item{border-bottom:1px solid var(--line);padding:9px 0;font-size:14px}
.clients{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:16px}
.client{height:30mm;border:1px solid var(--line);border-radius:14px;background:white;display:flex;align-items:center;justify-content:center;padding:9px}
.client img{max-width:100%;max-height:100%;object-fit:contain}
.footer{position:absolute;left:17mm;right:17mm;bottom:8mm;border-top:1px solid var(--line);padding-top:7px;display:flex;justify-content:space-between;font-size:11px;color:#777}
[dir="rtl"] body,[dir="rtl"] .page{font-family:Tahoma,Arial,sans-serif}
[dir="rtl"] .row{direction:rtl}
@page{size:A4 landscape;margin:0}
@media print{html,body{background:white}.toolbar{display:none}.book{padding:0}.page{box-shadow:none;margin:0;width:297mm;height:210mm;page-break-after:always}.card,.item,.client{break-inside:avoid}}
</style></head><body>
<div class="toolbar"><strong>البروفايل المؤسسي — PDF</strong><div><a href="/ar/profile/">العودة للبروفايل</a><button onclick="window.print()">تحميل PDF</button></div></div>
<div class="book" id="book"></div>
<script>
async function loadContent(){ const r=await fetch('/api/content',{cache:'no-store'}); return await r.json(); }
function tx(d,p,k,f=''){return d?.pages?.[p]?.texts?.[k]||f}
function fixPath(src){
  if(!src) return '';
  if(src.startsWith('http') || src.startsWith('/') || src.startsWith('data:')) return src;
  return '/' + src.replace(/^\.\//,'').replace(/^\.\.\//,'');
}
function im(d,p,k,f=''){return fixPath(d?.pages?.[p]?.images?.[k]?.src||f)}
function foot(n,total){return `<div class="footer"><span>Horizon Integration</span><span>${n} / ${total}</span></div>`}

const P='profile_ar';
function cards(d,arr){return arr.map(x=>`<div class="card"><h3>${tx(d,P,'profile_ar_text_'+x[0])}</h3><p>${tx(d,P,'profile_ar_text_'+x[1])}</p></div>`).join('')}
function list(d,arr){return arr.map(k=>`<div class="item">${tx(d,P,'profile_ar_text_'+k)}</div>`).join('')}
function render(d){
 const logo=im(d,P,'profile_ar_image_001'), hero=im(d,P,'profile_ar_image_003'), ops=im(d,P,'profile_ar_image_013');
 document.getElementById('book').innerHTML=`
<section class="page cover"><div><img class="logo" src="${logo}"><div class="kicker">${tx(d,P,'profile_ar_text_009',tx(d,P,'profile_ar_text_010'))}</div><h1>${tx(d,P,'profile_ar_text_010')}<br>${tx(d,P,'profile_ar_text_011')}</h1><p>${tx(d,P,'profile_ar_text_012',tx(d,P,'profile_ar_text_014'))}</p><div class="list">$<div class="item" style="border-color:rgba(255,255,255,.25);color:white">Infrastructure</div><div class="item" style="border-color:rgba(255,255,255,.25);color:white">Roads</div><div class="item" style="border-color:rgba(255,255,255,.25);color:white">Asphalt</div><div class="item" style="border-color:rgba(255,255,255,.25);color:white">Drainage</div></div></div><div>www.saudihic.com</div></section>
<section class="page"><div class="row"><div><div class="kicker">${tx(d,P,'profile_ar_text_021',tx(d,P,'profile_ar_text_023'))}</div><h2>${tx(d,P,'profile_ar_text_022',tx(d,P,'profile_ar_text_024'))}</h2><p>${tx(d,P,'profile_ar_text_023',tx(d,P,'profile_ar_text_025'))}</p><p>${tx(d,P,'profile_ar_text_024',tx(d,P,'profile_ar_text_026'))}</p></div><div>${hero?`<img class="hero-img" src="${hero}">`:''}</div></div>${foot(2,7)}</section>
<section class="page"><div class="kicker">${tx(d,P,'profile_ar_text_032',tx(d,P,'profile_ar_text_034'))}</div><h2>${tx(d,P,'profile_ar_text_033',tx(d,P,'profile_ar_text_035'))}</h2><p>${tx(d,P,'profile_ar_text_031',tx(d,P,'profile_ar_text_033'))}</p><div class="grid">${cards(d,[('035', '036'), ('037', '038'), ('039', '040'), ('043', '044')])}</div>${foot(3,7)}</section>
<section class="page"><div class="row"><div><div class="kicker">${tx(d,P,'profile_ar_text_047',tx(d,P,'profile_ar_text_049'))}</div><h2>${tx(d,P,'profile_ar_text_048',tx(d,P,'profile_ar_text_050'))}</h2><p>${tx(d,P,'profile_ar_text_049',tx(d,P,'profile_ar_text_051'))}</p><div class="list">${list(d,['061', '062', '063', '064', '065'])}</div></div><div>${ops?`<img class="small-img" src="${ops}">`:''}</div></div>${foot(4,7)}</section>
<section class="page"><div class="kicker">${tx(d,P,'profile_ar_text_066',tx(d,P,'profile_ar_text_068'))}</div><h2>${tx(d,P,'profile_ar_text_067',tx(d,P,'profile_ar_text_069'))}</h2><p>${tx(d,P,'profile_ar_text_068',tx(d,P,'profile_ar_text_070'))}</p><div class="grid">${cards(d,[('069', '071'), ('072', '074'), ('075', '077'), ('078', '080')])}</div>${foot(5,7)}</section>
<section class="page"><div class="kicker">${tx(d,P,'profile_ar_text_099',tx(d,P,'profile_ar_text_101'))}</div><h2>${tx(d,P,'profile_ar_text_100',tx(d,P,'profile_ar_text_102'))}</h2><p>${tx(d,P,'profile_ar_text_101',tx(d,P,'profile_ar_text_103'))}</p><div class="grid">${cards(d,[('103', '104'), ('106', '107'), ('109', '110'), ('112', '113')])}</div>${foot(6,7)}</section>
<section class="page"><div class="kicker">${tx(d,P,'profile_ar_text_125',tx(d,P,'profile_ar_text_127'))}</div><h2>${tx(d,P,'profile_ar_text_126',tx(d,P,'profile_ar_text_128'))}</h2><p>${tx(d,P,'profile_ar_text_127',tx(d,P,'profile_ar_text_129'))}</p><div class="clients">${['profile_ar_image_014','profile_ar_image_015','profile_ar_image_016','profile_ar_image_017','profile_ar_image_018','profile_ar_image_019','profile_ar_image_020','profile_ar_image_021'].map(k=>`<div class="client"><img src="${im(d,P,k)}"></div>`).join('')}</div>${foot(7,7)}</section>`;}
loadContent().then(render).catch(e=>document.getElementById('book').innerHTML='<section class="page"><h2>Content load failed</h2><p>'+e.message+'</p></section>');
</script></body></html>
