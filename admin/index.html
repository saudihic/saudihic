<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>لوحة التحكم | HIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --green:  #005340;
  --gl:     #006b52;
  --gold:   #C8A96E;
  --carbon: #1a1a1a;
  --dark:   #242222;
  --mid:    #3a3838;
  --border: rgba(255,255,255,.08);
  --text:   rgba(255,255,255,.85);
  --muted:  rgba(255,255,255,.4);
  --bg:     #111;
  --ease:   cubic-bezier(.25,.46,.45,.94);
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Alexandria', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── LOGIN ── */
#login-screen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 40%, #0d2b20 0%, var(--bg) 70%);
}
.login-box {
  width: 380px; background: var(--dark); border: 1px solid var(--border);
  border-radius: 4px; padding: 2.5rem;
}
.login-logo {
  width: 72px; height: 32px; background: var(--green); border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font: 700 13px/1 Inter; color: #fff; margin-bottom: 2rem;
}
.login-box h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: .35rem; }
.login-box p { font-size: .85rem; color: var(--muted); margin-bottom: 2rem; }
.field { margin-bottom: 1.25rem; }
.field label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: .5rem; font-weight: 600; }
.field input {
  width: 100%; padding: .75rem 1rem; background: var(--mid);
  border: 1px solid var(--border); border-radius: 3px;
  color: var(--text); font-family: 'Alexandria', sans-serif; font-size: .9rem;
  outline: none; transition: border-color .2s;
}
.field input:focus { border-color: var(--green); }
.btn-login {
  width: 100%; padding: .85rem; background: var(--green); color: #fff;
  border: none; border-radius: 3px; font-family: 'Alexandria', sans-serif;
  font-size: .95rem; font-weight: 700; cursor: pointer; transition: background .2s;
}
.btn-login:hover { background: var(--gl); }
.login-err { display: none; margin-top: 1rem; padding: .75rem 1rem; background: rgba(200,50,50,.15); border: 1px solid rgba(200,50,50,.3); border-radius: 3px; font-size: .83rem; color: #f88; text-align: center; }

/* ── SHELL ── */
#app { display: none; min-height: 100vh; }

/* TOPBAR */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 56px; background: var(--dark); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.5rem;
}
.topbar-brand { display: flex; align-items: center; gap: .85rem; }
.topbar-logo {
  width: 56px; height: 26px; background: var(--green); border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font: 700 11px/1 Inter; color: #fff;
}
.topbar-title { font-size: .85rem; font-weight: 600; color: var(--muted); }
.topbar-actions { display: flex; align-items: center; gap: .75rem; }
.save-btn {
  padding: .5rem 1.25rem; background: var(--green); color: #fff;
  border: none; border-radius: 3px; font-family: 'Alexandria', sans-serif;
  font-size: .83rem; font-weight: 700; cursor: pointer; transition: background .2s, opacity .2s;
  display: flex; align-items: center; gap: .5rem;
}
.save-btn:hover { background: var(--gl); }
.save-btn:disabled { opacity: .5; cursor: not-allowed; }
.logout-btn {
  padding: .5rem .85rem; background: transparent; color: var(--muted);
  border: 1px solid var(--border); border-radius: 3px;
  font-family: 'Alexandria', sans-serif; font-size: .78rem; cursor: pointer;
  transition: color .2s, border-color .2s;
}
.logout-btn:hover { color: #fff; border-color: rgba(255,255,255,.2); }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

/* LAYOUT */
.shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; padding-top: 56px; }

/* SIDEBAR */
.sidebar {
  background: var(--dark); border-left: 1px solid var(--border);
  position: fixed; top: 56px; right: 0; bottom: 0; width: 240px;
  overflow-y: auto; padding: 1rem 0;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.sidebar-section { padding: 0 1rem; margin-bottom: .25rem; }
.sidebar-label {
  font-size: .68rem; font-weight: 700; letter-spacing: .08em;
  color: var(--muted); padding: .75rem .5rem .4rem; display: block;
}
.sidebar-btn {
  width: 100%; text-align: right; padding: .6rem .75rem;
  background: transparent; border: none; border-radius: 3px;
  color: rgba(255,255,255,.6); font-family: 'Alexandria', sans-serif;
  font-size: .83rem; font-weight: 500; cursor: pointer;
  transition: background .15s, color .15s;
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-btn:hover { background: rgba(255,255,255,.05); color: var(--text); }
.sidebar-btn.active { background: rgba(0,83,64,.25); color: #fff; border-right: 2px solid var(--green); }
.sidebar-btn .page-lang { font-size: .68rem; color: var(--muted); font-family: Inter; }
.sidebar-divider { height: 1px; background: var(--border); margin: .5rem 1rem; }

/* MAIN */
.main { margin-right: 240px; padding: 2rem; }

/* PAGE HEADER */
.page-hdr {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 2rem; padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--border);
}
.page-hdr h2 { font-size: 1.15rem; font-weight: 700; }
.page-hdr span { font-size: .78rem; color: var(--muted); }
.field-count {
  font-size: .75rem; color: var(--muted);
  background: rgba(255,255,255,.06); padding: .3rem .75rem;
  border-radius: 999px; font-family: Inter;
}

/* SECTION GROUPS */
.field-section { margin-bottom: 2rem; }
.field-section-title {
  font-size: .72rem; font-weight: 700; letter-spacing: .1em;
  color: var(--gold); margin-bottom: 1rem;
  display: flex; align-items: center; gap: .6rem;
}
.field-section-title::after { content: ''; flex: 1; height: 1px; background: rgba(200,169,110,.2); }

/* FIELD ROWS */
.field-row {
  display: grid; grid-template-columns: 200px 1fr;
  gap: 0; margin-bottom: 1px;
  background: var(--dark); border: 1px solid var(--border); border-radius: 3px;
  overflow: hidden; transition: border-color .2s;
}
.field-row:hover { border-color: rgba(255,255,255,.14); }
.field-row:focus-within { border-color: var(--green); }
.field-key {
  padding: .75rem 1rem; background: rgba(255,255,255,.03);
  border-left: 1px solid var(--border);
  font-size: .72rem; color: var(--muted); font-family: Inter;
  display: flex; align-items: flex-start; padding-top: .85rem;
  word-break: break-all; line-height: 1.4;
}
.field-input {
  padding: .75rem 1rem; background: transparent; border: none;
  color: var(--text); font-family: 'Alexandria', sans-serif;
  font-size: .88rem; outline: none; width: 100%; resize: vertical;
  min-height: 42px;
}
.field-input:focus { background: rgba(0,83,64,.08); }

/* IMG FIELDS */
.img-section { margin-bottom: 2rem; }
.img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
.img-card {
  background: var(--dark); border: 1px solid var(--border); border-radius: 3px;
  overflow: hidden; transition: border-color .2s;
}
.img-card:hover { border-color: rgba(255,255,255,.18); }
.img-preview {
  height: 130px; background: var(--mid); overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.img-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-preview .no-img { font-size: .72rem; color: var(--muted); }
.img-card-body { padding: .75rem; }
.img-key { font-size: .68rem; color: var(--muted); font-family: Inter; margin-bottom: .5rem; word-break: break-all; }
.img-input {
  width: 100%; padding: .5rem .75rem; background: var(--mid);
  border: 1px solid var(--border); border-radius: 2px;
  color: var(--text); font-family: 'Alexandria', sans-serif;
  font-size: .75rem; outline: none; transition: border-color .2s;
}
.img-input:focus { border-color: var(--green); }

/* TOAST */
.toast {
  position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--green); color: #fff; padding: .75rem 1.5rem;
  border-radius: 3px; font-size: .85rem; font-weight: 600;
  opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; z-index: 999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: #8b2020; }

/* LOADING */
.loading-screen {
  display: flex; align-items: center; justify-content: center;
  height: calc(100vh - 56px); color: var(--muted); font-size: .85rem; gap: .75rem;
}
.spinner {
  width: 18px; height: 18px; border: 2px solid var(--border);
  border-top-color: var(--green); border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* EMPTY */
.empty { padding: 4rem 2rem; text-align: center; color: var(--muted); font-size: .9rem; }

/* QUOTE FRAME */
.quote-wrap { width: 100%; height: calc(100vh - 56px - 4rem); border: none; border-radius: 4px; background: white; display: block; }
.quote-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border); }
.quote-hdr h2 { font-size: 1.15rem; font-weight: 700; }
.quote-tabs { display: flex; gap: .5rem; }
.qtab { padding: .45rem 1rem; border-radius: 3px; font-family: Alexandria,sans-serif; font-size: .82rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); color: var(--muted); background: transparent; transition: all .2s; }
.qtab.active { background: var(--green); color: #fff; border-color: var(--green); }
/* RESPONSIVE */
@media (max-width: 700px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .main { margin-right: 0; }
  .field-row { grid-template-columns: 1fr; }
  .field-key { border-left: none; border-bottom: 1px solid var(--border); }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">HIC</div>
    <h1>لوحة التحكم</h1>
    <p>أدخل كلمة المرور للمتابعة</p>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="pwd-input" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn-login" onclick="doLogin()">دخول</button>
    <div class="login-err" id="login-err">كلمة مرور غير صحيحة</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-brand">
      <div class="topbar-logo">HIC</div>
      <span class="topbar-title">إدارة المحتوى</span>
    </div>
    <div class="topbar-actions">
      <div class="status-dot" id="status-dot" title="متصل"></div>
      <button class="save-btn" id="save-btn" onclick="saveContent()" disabled>
        <span>💾</span> حفظ التعديلات
      </button>
      <button class="logout-btn" onclick="doLogout()">خروج</button>
    </div>
  </div>

  <div class="shell">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-section">
        <span class="sidebar-label">الصفحات</span>
        <button class="sidebar-btn active" onclick="loadPage('home_ar')" id="btn-home_ar">
          <span>الرئيسية</span><span class="page-lang">AR</span>
        </button>
        <button class="sidebar-btn" onclick="loadPage('home_en')" id="btn-home_en">
          <span>الرئيسية</span><span class="page-lang">EN</span>
        </button>
      </div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-section">
        <button class="sidebar-btn" onclick="loadPage('profile_ar')" id="btn-profile_ar">
          <span>البروفايل</span><span class="page-lang">AR</span>
        </button>
        <button class="sidebar-btn" onclick="loadPage('profile_en')" id="btn-profile_en">
          <span>البروفايل</span><span class="page-lang">EN</span>
        </button>
      </div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-section">
        <button class="sidebar-btn" onclick="loadPage('bs_ar')" id="btn-bs_ar">
          <span>أنظمة البناء</span><span class="page-lang">AR</span>
        </button>
        <button class="sidebar-btn" onclick="loadPage('bs_en')" id="btn-bs_en">
          <span>أنظمة البناء</span><span class="page-lang">EN</span>
        </button>
      </div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-section">
        <span class="sidebar-label">عروض الأسعار</span>
        <button class="sidebar-btn" onclick="openQuote('fixed')" id="btn-quote-fixed">
          <span>سعر ثابت</span><span class="page-lang">PDF</span>
        </button>
        <button class="sidebar-btn" onclick="openQuote('unit')" id="btn-quote-unit">
          <span>سعر وحدة</span><span class="page-lang">PDF</span>
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main" id="main-content">
      <div class="loading-screen">
        <div class="spinner"></div>
        <span>جار التحميل...</span>
      </div>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const PAGES = {
  home_ar:    { label: 'الرئيسية — عربي',        url: '../ar/index.html',                   lang: 'ar' },
  home_en:    { label: 'الرئيسية — إنجليزي',      url: '../index.html',                      lang: 'en' },
  profile_ar: { label: 'البروفايل — عربي',        url: '../ar/profile/index.html',           lang: 'ar' },
  profile_en: { label: 'البروفايل — إنجليزي',     url: '../profile/index.html',              lang: 'en' },
  bs_ar:      { label: 'أنظمة البناء — عربي',    url: '../ar/building-systems/index.html',  lang: 'ar' },
  bs_en:      { label: 'أنظمة البناء — إنجليزي', url: '../building-systems/index.html',     lang: 'en' },
};

// Section label map — key fragment → Arabic label
const SECTION_LABELS = {
  hero: 'الهيرو',
  nav: 'شريط التنقل',
  intro: 'المقدمة',
  about: 'من نحن',
  svc: 'الخدمات',
  service: 'الخدمات',
  val: 'القيم',
  ops: 'التنفيذ الميداني',
  fleet: 'الأسطول',
  metric: 'الأرقام',
  gallery: 'المعرض',
  client: 'العملاء',
  contact: 'التواصل',
  footer: 'الفوتر',
  pship: 'الشراكة',
  bs: 'أنظمة البناء',
  sys: 'الأنظمة',
  dl: 'التحميلات',
  qlink: 'روابط سريعة',
  btn: 'الأزرار',
  tag: 'العناوين الفرعية',
  eyebrow: 'الإيبرو',
};

// ─── STATE ────────────────────────────────────────────────────────────────────
let password = '';
let contentStore = {};   // { page_key: { texts: {}, images: {} } }
let currentPage = 'home_ar';
let dirty = false;

// ─── LOGIN ────────────────────────────────────────────────────────────────────
document.getElementById('pwd-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

async function doLogin() {
  const pwd = document.getElementById('pwd-input').value.trim();
  if (!pwd) return;
  password = pwd;

  // Try to load existing content from KV
  try {
    const res = await fetch('/api/content');
    const data = await res.json();
    if (data && data.pages) contentStore = data.pages;
  } catch(e) {
    // Local preview — no API, password verified on save
  }

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadPage('home_ar');
}

function showLoginError() {
  const el = document.getElementById('login-err');
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

function doLogout() {
  if (dirty && !confirm('عندك تعديلات غير محفوظة. تريد تخرج؟')) return;
  location.reload();
}

// ─── LOAD PAGE ────────────────────────────────────────────────────────────────
async function loadPage(pageKey) {
  currentPage = pageKey;

  // Update sidebar active state
  document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
  const activeBtn = document.getElementById('btn-' + pageKey);
  if (activeBtn) activeBtn.classList.add('active');

  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="loading-screen"><div class="spinner"></div><span>جار التحميل...</span></div>';

  const page = PAGES[pageKey];
  if (!page) return;

  try {
    // Fetch the HTML page to scan for data-hic-edit and data-hic-img attributes
    const res = await fetch(page.url);
    const html = await res.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');

    // Extract text fields
    const textEls = doc.querySelectorAll('[data-hic-edit]');
    const imgEls  = doc.querySelectorAll('[data-hic-img], [data-hic-bg]');

    const texts = {};
    textEls.forEach(el => {
      const key = el.getAttribute('data-hic-edit');
      // Get current value from store or from HTML
      const stored = contentStore[pageKey]?.texts?.[key];
      texts[key] = stored !== undefined ? stored : (el.textContent.trim() || el.getAttribute('placeholder') || '');
    });

    const images = {};
    imgEls.forEach(el => {
      const key = el.getAttribute('data-hic-img') || el.getAttribute('data-hic-bg');
      const stored = contentStore[pageKey]?.images?.[key];
      const current = el.getAttribute('src') || el.style.backgroundImage?.match(/url\(['"]?([^'"]+)['"]?\)/)?.[1] || '';
      images[key] = stored !== undefined ? stored : current;
    });

    renderPage(pageKey, page, texts, images);

  } catch(e) {
    main.innerHTML = `<div class="empty">⚠️ تعذّر تحميل الصفحة<br><small style="color:var(--muted)">${e.message}</small></div>`;
  }
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function renderPage(pageKey, page, texts, images) {
  const main = document.getElementById('main-content');
  const textKeys = Object.keys(texts);
  const imgKeys  = Object.keys(images);

  // Group text fields by section
  const sections = {};
  textKeys.forEach(key => {
    const sec = detectSection(key);
    if (!sections[sec]) sections[sec] = [];
    sections[sec].push(key);
  });

  let html = `
    <div class="page-hdr">
      <div>
        <h2>${page.label}</h2>
      </div>
      <span class="field-count">${textKeys.length} حقل نصي · ${imgKeys.length} صورة</span>
    </div>
  `;

  // Text sections
  Object.entries(sections).forEach(([sec, keys]) => {
    html += `<div class="field-section">`;
    html += `<div class="field-section-title">${sec}</div>`;
    keys.forEach(key => {
      const val = texts[key] || '';
      const isLong = val.length > 80;
      const shortKey = key.replace(/^[a-z_]+_[a-z]{2}_/, '').replace(/_/g, ' ');
      html += `
        <div class="field-row">
          <div class="field-key">${shortKey}</div>
          ${isLong
            ? `<textarea class="field-input" data-key="${key}" data-page="${pageKey}" rows="${Math.min(6, Math.ceil(val.length/60))}" onchange="onFieldChange(this)">${escHtml(val)}</textarea>`
            : `<input class="field-input" type="text" data-key="${key}" data-page="${pageKey}" value="${escAttr(val)}" oninput="onFieldChange(this)"/>`
          }
        </div>`;
    });
    html += `</div>`;
  });

  // Image fields
  if (imgKeys.length > 0) {
    html += `<div class="img-section">`;
    html += `<div class="field-section-title">الصور</div>`;
    html += `<div class="img-grid">`;
    imgKeys.forEach(key => {
      const src = images[key] || '';
      const shortKey = key.replace(/^[a-z_]+_[a-z]{2}_/, '').replace(/_/g, ' ');
      html += `
        <div class="img-card">
          <div class="img-preview" id="prev-${key}">
            ${src ? `<img src="${escAttr(src)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" alt=""/>
                     <div class="no-img" style="display:none">لا توجد صورة</div>`
                  : `<div class="no-img">لا توجد صورة</div>`}
          </div>
          <div class="img-card-body">
            <div class="img-key">${shortKey}</div>
            <input class="img-input" type="text" placeholder="assets/img/..."
              data-key="${key}" data-page="${pageKey}" value="${escAttr(src)}"
              oninput="onImgChange(this)"/>
          </div>
        </div>`;
    });
    html += `</div></div>`;
  }

  main.innerHTML = html;
}

// ─── SECTION DETECTION ────────────────────────────────────────────────────────
function detectSection(key) {
  // Strip page prefix
  const bare = key.replace(/^[a-z]+_[a-z]{2}_/, '');
  for (const [fragment, label] of Object.entries(SECTION_LABELS)) {
    if (bare.startsWith(fragment)) return label;
  }
  // Fallback: use first word
  const first = bare.split('_')[0];
  return first.charAt(0).toUpperCase() + first.slice(1);
}

// ─── CHANGE HANDLERS ─────────────────────────────────────────────────────────
function onFieldChange(el) {
  const { key, page } = el.dataset;
  if (!contentStore[page]) contentStore[page] = { texts: {}, images: {} };
  if (!contentStore[page].texts) contentStore[page].texts = {};
  contentStore[page].texts[key] = el.value || el.textContent;
  markDirty();
}

function onImgChange(el) {
  const { key, page } = el.dataset;
  if (!contentStore[page]) contentStore[page] = { texts: {}, images: {} };
  if (!contentStore[page].images) contentStore[page].images = {};
  contentStore[page].images[key] = el.value;
  // Update preview
  const prev = document.getElementById('prev-' + key);
  if (prev) {
    const src = el.value.trim();
    prev.innerHTML = src
      ? `<img src="${escAttr(src)}" onerror="this.style.display='none'" alt=""/><div class="no-img" style="display:none">خطأ في الرابط</div>`
      : `<div class="no-img">لا توجد صورة</div>`;
  }
  markDirty();
}

function markDirty() {
  dirty = true;
  document.getElementById('save-btn').disabled = false;
}

// ─── SAVE ────────────────────────────────────────────────────────────────────
async function saveContent() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.innerHTML = '<span>⏳</span> جار الحفظ...';

  try {
    const res = await fetch('/api/content', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password, content: { pages: contentStore } })
    });
    const data = await res.json();

    if (data.ok || data.success) {
      dirty = false;
      btn.innerHTML = '<span>💾</span> حفظ التعديلات';
      showToast('✓ تم الحفظ بنجاح');
    } else {
      btn.disabled = false;
      btn.innerHTML = '<span>💾</span> حفظ التعديلات';
      if (data.error === 'Unauthorized') {
        showToast('كلمة المرور غير صحيحة', true);
      } else {
        showToast('خطأ في الحفظ: ' + (data.error || 'unknown'), true);
      }
    }
  } catch(e) {
    btn.disabled = false;
    btn.innerHTML = '<span>💾</span> حفظ التعديلات';
    showToast('تعذّر الاتصال بالسيرفر', true);
  }
}

// ─── TOAST ───────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  requestAnimationFrame(() => el.classList.add('show'));
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return String(s).replace(/"/g,'&quot;'); }

// ─── QUOTE ───────────────────────────────────────────────────────────────────
function openQuote(type) {
  currentPage = 'quote_' + type;

  // Update sidebar
  document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btn-quote-' + type);
  if (btn) btn.classList.add('active');

  const src = type === 'unit' ? '../quote-unit.html' : '../quote.html';
  const label = type === 'unit' ? 'عرض سعر — وحدة' : 'عرض سعر — ثابت';

  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="quote-hdr">
      <div>
        <h2>${label}</h2>
      </div>
      <div class="quote-tabs">
        <button class="qtab ${type === 'fixed' ? 'active' : ''}" onclick="openQuote('fixed')">سعر ثابت</button>
        <button class="qtab ${type === 'unit' ? 'active' : ''}" onclick="openQuote('unit')">سعر وحدة</button>
      </div>
    </div>
    <iframe class="quote-wrap" src="${src}" title="${label}"></iframe>
  `;
}

// Warn on unsaved changes
window.addEventListener('beforeunload', e => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});
</script>
</body>
</html>
