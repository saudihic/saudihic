ar(--gd);color:#fff;border-radius:18px;padding:20px;box-shadow:var(--shadow)}.workflow h2{margin:0 0 3px;font-size:17px}.workflow p{margin:0 0 15px;color:#dcf3ebaa;font-size:12px}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.step{border:1px solid #ffffff24;background:#ffffff0b;border-radius:11px;padding:12px}.step.on{background:var(--gold);border-color:var(--gold);color:var(--gd)}.step small{font:800 12px Inter;opacity:.7}.step b{display:block;font-size:12px;margin-top:4px}.split{display:grid;grid-template-columns:1.45fr 1fr;gap:20px;margin-top:22px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:0 0 10px}.section-head h2{margin:0;color:var(--gd);font-size:18px}.section-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.project-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.project-card{width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;text-align:right;box-shadow:var(--shadow)}.project-card:hover{border-color:var(--g)}.tag{display:inline-block;border-radius:99px;background:#edf5f2;color:var(--g);padding:5px 9px;font-size:11px;font-weight:700}.project-card h3{color:var(--gd);margin:10px 0 4px;font-size:17px}.project-card>p{color:var(--muted);margin:0;font-size:12px}.mini{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:15px;padding-top:13px;gap:8px}.mini small{display:block;color:#87918d;font-size:10px}.mini b{font-size:12px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.panel-title{padding:17px 18px;border-bottom:1px solid var(--line)}.panel-title h2{margin:0;color:var(--gd);font-size:16px}.panel-title p{margin:3px 0 0;color:var(--muted);font-size:11px}.attention{padding:8px 14px}.att-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 3px;border-bottom:1px solid var(--line)}.att-row:last-child{border:0}.att-row b{display:block;font-size:12px}.att-row small{color:var(--muted);font-size:10px}.qty{background:#fff6e6;color:var(--amber);border-radius:8px;padding:6px 8px;font-weight:700;font-size:11px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:850px;font-size:12px}th{background:#f7f9f8;color:#61706b;text-align:right;padding:11px 13px;font-size:11px}td{padding:12px 13px;border-top:1px solid var(--line);vertical-align:middle}td small{display:block;color:#7a8581;margin-top:2px}.status{display:inline-block;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:700}.pending{background:#fff6e6;color:var(--amber)}.approved{background:#eaf8f1;color:#067647}.billed,.sent,.invoiced{background:#eef2f6;color:#475467}.empty{text-align:center;padding:45px 20px;color:#7c8883;background:#fff;border:1px dashed #bdcbc6;border-radius:16px}.empty b{display:block;color:#52605b;margin-bottom:5px}.project-hero{background:var(--gd);color:#fff;border-radius:18px;padding:22px;margin-bottom:14px;display:flex;justify-content:space-between;gap:15px;align-items:center}.project-hero h2{margin:9px 0 3px;font-size:22px}.project-hero p{margin:0;color:#dff3ecaa;font-size:12px}.action-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.mt{margin-top:18px}.back{border:0;background:transparent;color:var(--g);font-weight:700;margin:0 0 10px}.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.tool{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;color:inherit;text-decoration:none;box-shadow:var(--shadow)}.tool:hover{border-color:var(--g)}.tool b{display:block;color:var(--gd);font-size:17px}.tool p{color:var(--muted);font-size:12px}.login{position:fixed;inset:0;z-index:1000;background:#10221e;display:grid;place-items:center;padding:20px}.login-box{width:360px;max-width:100%;background:#fff;border-radius:18px;padding:28px;text-align:center}.login-mark{width:64px;height:64px;margin:0 auto 13px;background:var(--gold);color:var(--gd);border-radius:17px;display:grid;place-items:center;font:800 27px Inter}.login h2{margin:0;color:var(--gd)}.login p{color:var(--muted);font-size:12px}.field{margin-top:12px;text-align:right}.field label{display:block;font-size:12px;font-weight:700;color:#52615c;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d5dfdc;border-radius:9px;background:#fff;padding:10px 11px;color:var(--ink);outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--g);box-shadow:0 0 0 3px #08745b18}.field textarea{min-height:75px;resize:vertical}.login-err{display:none;color:var(--red);font-size:12px;margin-top:10px}.modal{border:0;border-radius:18px;padding:0;width:680px;max-width:calc(100% - 28px);max-height:90vh;box-shadow:0 22px 70px #0004}.modal::backdrop{background:#0008}.modal-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:start;justify-content:space-between}.modal-head h2{margin:0;color:var(--gd);font-size:19px}.modal-head p{margin:4px 0 0;color:var(--muted);font-size:11px}.close{border:0;background:#eef3f1;width:34px;height:34px;border-radius:9px}.modal-body{padding:20px 22px;overflow:auto}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 13px}.full{grid-column:1/-1}.modal-foot{display:flex;gap:8px;padding-top:18px}.toast{position:fixed;left:20px;bottom:20px;z-index:2000;background:var(--gd);color:#fff;border-radius:10px;padding:12px 16px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.danger-link{color:var(--red);border:0;background:transparent;font-weight:700}.icon-btn{border:0;background:#f2f5f4;border-radius:8px;padding:7px;color:#43514c}.menu-overlay{display:none}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.project-grid{grid-template-columns:1fr}}
@media(max-width:780px){.app{display:block}.side{position:fixed;right:0;top:0;z-index:100;width:270px;transform:translateX(100%);transition:.2s}.side.open{transform:none}.menu-overlay.open{display:block;position:fixed;inset:0;background:#0007;z-index:90}.mobile-menu{display:inline-flex}.main{padding:18px 14px}.head h1{font-size:20px}.head p{display:none}.head-actions .btn-outline{display:none}.steps{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.action-row{grid-template-columns:1fr}.tools{grid-template-columns:1fr}.project-hero{display:block}.project-hero .btn{margin-top:12px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}
@media(max-width:430px){.cards{grid-template-columns:1fr}.head .btn-primary{padding:10px 11px;font-size:12px}.steps{grid-template-columns:1fr 1fr}}

<body>
<div id="login" class="login"><div class="login-box"><div class="login-mark">HIC</div><h2>متابعة المشاريع</h2><p>الدخول مقيّد لمستخدمي لوحة الإدارة</p><div class="field"><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password"></div><button id="loginBtn" class="btn btn-primary" style="width:100%;margin-top:12px">دخول</button><div id="loginErr" class="login-err">كلمة المرور غير صحيحة</div></div></div>
<div id="overlay" class="menu-overlay"></div>
<div class="app">
<aside id="side" class="side"><div class="brand"><div class="brand-mark">HIC</div><div><b>مركز العمليات</b><small>متابعة المشاريع</small></div></div><nav class="nav"><button data-view="dashboard" class="active">▦ لوحة المتابعة</button><button data-view="projects">▣ المشاريع</button><button data-view="daily">◫ التنفيذ اليومي</button><button data-view="supply">▤ التوريدات والردود</button><button data-view="statements">▧ المستخلصات</button><button data-view="tools">⚙ أدوات HIC</button></nav><div class="side-foot"><a href="index.html">العودة للوحة الإدارة</a></div></aside>
<main class="main"><header class="head"><div style="display:flex;align-items:center;gap:10px"><button id="menuBtn" class="btn btn-outline mobile-menu">☰</button><div><h1 id="pageTitle">الموقف التنفيذي والمالي</h1><p>من التنفيذ الميداني إلى المستخلص ثم الفاتورة المحاسبية</p></div></div><div class="head-actions"><button id="backupBtn" class="btn btn-outline">⇩ نسخة Excel</button><button id="newProjectBtn" class="btn btn-primary">＋ مشروع جديد</button></div></header><div id="cloudBanner" class="banner hidden">تعذر الاتصال بقاعدة البيانات المشتركة. لم يتم حفظ أي تعديل جديد.</div><div id="content"></div></main>
</div>
<dialog id="modal" class="modal"><div class="modal-head"><div><h2 id="modalTitle"></h2><p id="modalNote"></p></div><button class="close" onclick="closeModal()">×</button></div><form id="entryForm" class="modal-body"><div id="formFields" class="form-grid"></div><div class="modal-foot"><button class="btn btn-primary" type="submit">حفظ</button><button class="btn btn-outline" type="button" onclick="closeModal()">إلغاء</button></div></form></dialog>
<div id="toast" class="toast"></div>
<script>
const U=['طن','م³','م²','م ط','رد / تريب'];
const C=['توريد مواد ترابية','توريد وتسوية','أعمال أسفلت','أرصفة ومشهد حضري','حفر ونقل','قص أرصفة ونقل مخلفات','أعمال أخرى'];
const ST={pending:'بانتظار الاعتماد',approved:'معتمد وجاهز للمستخلص',billed:'ضمن مستخلص',sent:'مرسل للمحاسبة',invoiced:'تمت فوترته'};
const V={dashboard:'الموقف التنفيذي والمالي',projects:'المشاريع',daily:'التنفيذ اليومي',supply:'التوريدات والردود',statements:'المستخلصات والفوترة',tools:'أدوات HIC',project:'المشروع'};
let DATA={projects:[],items:[],logs:[],statements:[]},SHARED={},online=false,view='dashboard',pid='',editing=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],id=()=>crypto.randomUUID(),today=()=>new Date().toISOString().slice(0,10),num=v=>Number(v)||0,fmt=v=>num(v).toLocaleString('ar-SA',{maximumFractionDigits:2}),money=v=>fmt(v)+' ر.س',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sb(){try{const c=window.KING_SUPABASE_CONFIG||{};return c.url&&c.anonKey&&window.supabase?window.supabase.createClient(c.url,c.anonKey):null}catch(e){return null}}
async function load(){const client=sb(),c=window.KING_SUPABASE_CONFIG||{};if(!client){cloud(false);return render()}const q=await client.from(c.table||'king_accounting_state').select('data').eq('company_id',c.companyId||'main').maybeSingle();if(q.error||!q.data){cloud(false);return render()}SHARED=q.data.data||{};DATA=SHARED.projectControlV2||{projects:[],items:[],logs:[],statements:[]};for(const k of ['projects','items','logs','statements'])if(!Array.isArray(DATA[k]))DATA[k]=[];online=true;cloud(true);render()}
async function persist(){if(!online)return cloud(false);const client=sb(),c=window.KING_SUPABASE_CONFIG||{};SHARED.projectControlV2=DATA;const q=await client.from(c.table||'king_accounting_state').upsert({company_id:c.companyId||'main',data:SHARED,updated_at:new Date().toISOString(),updated_by:'project-control-v2'},{onConflict:'company_id'});if(q.error){cloud(false);toast('تعذر الحفظ')}else{cloud(true);toast('تم الحفظ')}}
function cloud(ok){online=ok;$('#cloudBanner').classList.toggle('hidden',ok)}function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
$('#loginBtn').onclick=login;$('#password').onkeydown=e=>{if(e.key==='Enter')login()};async function login(){const b=$('#loginBtn'),er=$('#loginErr');er.style.display='none';b.disabled=true;b.textContent='جارٍ التحقق…';try{const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})}),d=await r.json();if(d.ok){sessionStorage.setItem('hic_admin_ok','1');$('#login').classList.add('hidden');load()}else er.style.display='block'}catch(e){er.textContent='تعذر الاتصال بخدمة الدخول';er.style.display='block'}b.disabled=false;b.textContent='دخول'}
if(sessionStorage.getItem('hic_admin_ok')==='1'){ $('#login').classList.add('hidden');load() }
$$('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));$('#menuBtn').onclick=()=>{$('#side').classList.add('open');$('#overlay').classList.add('open')};$('#overlay').onclick=closeMenu;function closeMenu(){$('#side').classList.remove('open');$('#overlay').classList.remove('open')}
function go(v,p){view=v;if(p)pid=p;$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#pageTitle').textContent=v==='project'?(project()?.name||'المشروع'):V[v];closeMenu();render()}
function project(){return DATA.projects.find(x=>x.id===pid)}function item(i){return DATA.items.find(x=>x.id===i)}function pName(i){return DATA.projects.find(x=>x.id===i)?.name||'—'}
function status(v){return `<span class="status ${esc(v)}">${esc(ST[v]||v)}</span>`}function empty(a,b=''){return `<div class="empty"><b>${a}</b>${b}</div>`}function section(t,n,a=''){return `<div class="section-head"><div><h2>${t}</h2><p>${n}</p></div>${a}</div>`}
function render(){if(!$('#content'))return;$('#pageTitle').textContent=view==='project'?(project()?.name||'المشروع'):V[view];if(view==='dashboard')dashboard();if(view==='projects')projectsView();if(view==='daily')logsView(DATA.logs,'جميع سجلات التنفيذ');if(view==='supply')logsView(DATA.logs.filter(l=>['طن','م³','رد / تريب'].includes(item(l.itemId)?.unit)),'التوريدات والردود');if(view==='statements')statementsView(DATA.statements);if(view==='tools')toolsView();if(view==='project')projectView()}
function totals(){let executed=0,approved=0,pending=0,retained=0;DATA.logs.forEach(l=>{const v=num(l.qty)*num(item(l.itemId)?.price);executed+=v;if(l.status==='approved')approved+=v;if(l.status==='pending')pending++});DATA.statements.forEach(s=>retained+=num(s.retention));return{executed,approved,pending,retained}}
function dashboard(){const s=totals(),active=DATA.projects.filter(p=>p.status!=='مغلق').length,recent=[...DATA.projects].reverse().slice(0,4),pending=[...DATA.logs].filter(l=>l.status==='pending').reverse().slice(0,5);$('#content').innerHTML=`<div class="cards"><div class="kpi"><small>المشاريع النشطة</small><strong>${active}</strong><span>مشروع</span></div><div class="kpi"><small>قيمة التنفيذ المسجل</small><strong>${money(s.executed)}</strong><span>قبل الضريبة</span></div><div class="kpi"><small>جاهز للمستخلص</small><strong>${money(s.approved)}</strong><span>${s.pending} سجل ينتظر الاعتماد</span></div><div class="kpi"><small>إجمالي الاحتجاز</small><strong>${money(s.retained)}</strong><span>من المستخلصات الصادرة</span></div></div><div class="workflow"><h2>دورة العمل</h2><p>الفاتورة الضريبية تصدر من النظام المحاسبي</p><div class="steps">${['تسعير البند','عرض السعر','التنفيذ والاعتماد','المستخلص','الفاتورة بالمحاسبة'].map((x,i)=>`<div class="step ${i===2||i===3?'on':''}"><small>${i+1}</small><b>${x}</b></div>`).join('')}</div></div><div class="split"><div>${section('آخر المشاريع','اضغط لفتح تفاصيل المشروع')}${projectCards(recent)}</div><div>${section('تحتاج متابعة','كميات لم تعتمد بعد')}<div class="panel attention">${pending.length?pending.map(l=>`<div class="att-row"><div><b>${esc(item(l.itemId)?.name||'بند محذوف')}</b><small>${esc(pName(l.projectId))} · ${esc(l.date)}</small></div><span class="qty num">${fmt(l.qty)} ${esc(item(l.itemId)?.unit||'')}</span></div>`).join(''):empty('لا توجد كميات معلقة')}</div></div></div>`}
function projectCards(rows){if(!rows.length)return empty('لا توجد مشاريع بعد','أضف أول مشروع ثم بنوده وأسعاره.');return `<div class="project-grid">${rows.map(p=>{const its=DATA.items.filter(i=>i.projectId===p.id),ls=DATA.logs.filter(l=>l.projectId===p.id),value=ls.reduce((a,l)=>a+num(l.qty)*num(item(l.itemId)?.price),0);return `<button class="project-card" onclick="go('project','${p.id}')"><span class="tag">${esc(p.category||'مشروع')}</span><h3>${esc(p.name)}</h3><p>${esc(p.client||'لم يسجل العميل')}</p><div class="mini"><div><small>نوع الطلب</small><b>${p.contractMode==='open'?'مفتوح':'كمية محددة'}</b></div><div><small>البنود</small><b>${its.length}</b></div><div><small>التنفيذ</small><b class="num">${money(value)}</b></div></div></button>`}).join('')}</div>`}
function projectsView(){$('#content').innerHTML=section('كل المشاريع',DATA.projects.length+' مشروع مسجل')+projectCards(DATA.projects)}
function projectView(){const p=project();if(!p)return go('projects');const its=DATA.items.filter(i=>i.projectId===p.id),ls=DATA.logs.filter(l=>l.projectId===p.id),ss=DATA.statements.filter(s=>s.projectId===p.id),ready=ls.filter(l=>l.status==='approved').length;$('#content').innerHTML=`<button class="back" onclick="go('projects')">← العودة إلى المشاريع</button><div class="project-hero"><div><span class="tag">${esc(p.category)}</span><h2>${esc(p.name)}</h2><p>${esc(p.client||'عميل غير مسجل')} · مرجع العرض: ${esc(p.quoteRef||'غير مسجل')}</p></div><div><button class="btn btn-outline" onclick="openForm('project','${p.id}')">تعديل</button> <button class="btn btn-danger" onclick="removeRecord('project','${p.id}')">حذف</button></div></div><div class="action-row"><button class="btn btn-primary" onclick="openForm('item')">＋ بند تعاقدي</button><button class="btn btn-primary" onclick="openForm('log')">＋ تسجيل تنفيذ / توريد</button><button class="btn btn-gold" ${ready?'':'disabled'} onclick="openForm('statement')">إنشاء مستخلص (${ready})</button></div>${itemsTable(its)}<div class="mt">${logsTable(ls,'سجل التنفيذ والتوريد')}</div><div class="mt">${statementsTable(ss)}</div>`}
function itemsTable(rows){return `<div class="panel"><div class="panel-title"><h2>بنود المشروع وأسعاره</h2><p>كل سعر خاص بهذا المشروع</p></div><div class="table-wrap"><table><thead><tr><th>البند</th><th>الوحدة</th><th>الكمية</th><th>السماكة</th><th>السعر</th><th>الاحتجاز</th><th>إجراءات</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td><b>${esc(r.name)}</b><small>${esc(r.code||'بدون كود')}</small></td><td>${esc(r.unit)}</td><td class="num">${r.contractQty?fmt(r.contractQty):'مفتوح'}</td><td class="num">${r.thickness?fmt(r.thickness)+' سم':'—'}</td><td class="num"><b>${money(r.price)}</b></td><td class="num">${fmt(r.retention)}%</td><td><button class="icon-btn" onclick="openForm('item','${r.id}')">تعديل</button> <button class="danger-link" onclick="removeRecord('item','${r.id}')">حذف</button></td></tr>`).join(''):`<tr><td colspan="7" style="text-align:center;padding:30px">أضف بنود المشروع وأسعارها</td></tr>`}</tbody></table></div></div>`}
function logsView(rows,title){$('#content').innerHTML=logsTable(rows,title)}function logsTable(rows,title){return `<div class="panel"><div class="panel-title"><h2>${title}</h2><p>${rows.length} سجل</p></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>المشروع / البند</th><th>الكمية</th><th>القيمة</th><th>التذكرة</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td class="num">${esc(r.date)}</td><td><b>${esc(item(r.itemId)?.name||'بند محذوف')}</b><small>${esc(pName(r.projectId))}</small></td><td class="num"><b>${fmt(r.qty)}</b> ${esc(item(r.itemId)?.unit||'')}</td><td class="num">${money(num(r.qty)*num(item(r.itemId)?.price))}</td><td>${esc(r.ticket||'—')}</td><td>${status(r.status)}</td><td>${r.status==='pending'?`<button class="btn btn-sm btn-outline" onclick="approve('${r.id}',1)">اعتماد</button>`:''}${r.status==='approved'?`<button class="btn btn-sm btn-outline" onclick="approve('${r.id}',0)">إلغاء الاعتماد</button>`:''} <button class="icon-btn" onclick="openLogFromAny('${r.id}')">تعديل</button> <button class="danger-link" onclick="removeRecord('log','${r.id}')">حذف</button></td></tr>`).join(''):`<tr><td colspan="7" style="text-align:center;padding:30px">لا توجد سجلات تنفيذ</td></tr>`}</tbody></table></div></div>`}
function statementsView(rows){$('#content').innerHTML=statementsTable(rows)}function statementsTable(rows){return `<div class="panel"><div class="panel-title"><h2>المستخلصات والفوترة</h2><p>الفاتورة الضريبية تصدر من النظام المحاسبي</p></div><div class="table-wrap"><table><thead><tr><th>المستخلص</th><th>المشروع</th><th>الفترة</th><th>الإجمالي</th><th>الاحتجاز</th><th>الصافي</th><th>فاتورة المحاسبة</th><th>إجراءات</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td><b>${esc(r.no)}</b><small>${esc(r.date)}</small></td><td>${esc(pName(r.projectId))}</td><td class="num">${esc(r.periodFrom||'—')} إلى ${esc(r.periodTo||'—')}</td><td class="num">${money(r.gross||r.value)}</td><td class="num">${money(r.retention)}</td><td class="num"><b>${money(r.net||r.value)}</b></td><td>${r.invoiceRef?`<b style="color:var(--g)">${esc(r.invoiceRef)}</b>`:'بانتظار الربط'}</td><td><button class="icon-btn" onclick="openStatementFromAny('${r.id}')">ربط الفاتورة</button> <button class="danger-link" onclick="removeRecord('statement','${r.id}')">حذف</button></td></tr>`).join(''):`<tr><td colspan="8" style="text-align:center;padding:30px">لا توجد مستخلصات</td></tr>`}</tbody></table></div></div>`}

function field(label,name,value='',type='text',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function select(label,name,value,opts){return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(o=>{const v=typeof o==='string'?o:o[0],t=typeof o==='string'?o:o[1];return `<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`}).join('')}</select></div>`}function area(label,name,value=''){return `<div class="field full"><label>${label}</label><textarea name="${name}">${esc(value)}</textarea></div>`}
function openForm(type,rid){editing={type,rid};let r={},title='',note='';if(type==='project'){r=DATA.projects.find(x=>x.id===rid)||{};title=rid?'تعديل المشروع':'مشروع جديد';$('#formFields').innerHTML=field('اسم المشروع *','name',r.name,'text','required')+field('العميل','client',r.client)+select('نوع المشروع','category',r.category||C[0],C)+select('نوع الاتفاق','contractMode',r.contractMode||'open',[['open','طلبات مفتوحة / فوترة دورية'],['fixed','كمية تعاقدية محددة']])+field('مرجع العرض / أمر الشراء','quoteRef',r.quoteRef)+field('تاريخ البداية','startDate',r.startDate||today(),'date')+select('الحالة','status',r.status||'نشط',['نشط','متوقف','مغلق'])+area('ملاحظات','notes',r.notes)}
if(type==='item'){r=DATA.items.find(x=>x.id===rid)||{};title=rid?'تعديل البند':'إضافة بند تعاقدي';$('#formFields').innerHTML=field('اسم البند *','name',r.name,'text','required')+field('كود البند','code',r.code)+select('الوحدة','unit',r.unit||'طن',U)+field('سعر الوحدة لهذا المشروع *','price',r.price,'number','min="0" step="0.01" required')+field('الكمية التعاقدية (0 للمفتوح)','contractQty',r.contractQty||0,'number','min="0" step="0.01"')+field('السماكة سم','thickness',r.thickness||0,'number','min="0" step="0.01"')+field('الكثافة طن/م³','density',r.density||0,'number','min="0" step="0.01"')+field('سعة الرد / التريب','tripCapacity',r.tripCapacity||0,'number','min="0" step="0.01"')+field('نسبة الاحتجاز %','retention',r.retention||0,'number','min="0" max="100" step="0.01"')+area('ملاحظات','notes',r.notes)}
if(type==='log'){r=DATA.logs.find(x=>x.id===rid)||{};title=rid?'تعديل سجل التنفيذ':'تسجيل تنفيذ أو توريد';const its=DATA.items.filter(i=>i.projectId===pid);if(!its.length){toast('أضف بندًا للمشروع أولًا');return}$('#formFields').innerHTML=select('البند *','itemId',r.itemId||its[0].id,its.map(i=>[i.id,i.name+' — '+i.unit]))+field('التاريخ *','date',r.date||today(),'date','required')+field('الكمية المنفذة *','qty',r.qty,'number','min="0.01" step="0.01" required')+field('رقم التذكرة / الرد','ticket',r.ticket)+select('حالة الاعتماد','status',r.status||'pending',[['pending','بانتظار الاعتماد'],['approved','معتمد وجاهز للمستخلص']])+area('ملاحظات','notes',r.notes)}
if(type==='statement'){r=DATA.statements.find(x=>x.id===rid)||{};title=rid?'ربط المستخلص بالفاتورة':'إنشاء مستخلص دوري';if(rid){$('#formFields').innerHTML=`<div class="full banner"><b>${esc(r.no)}</b> · الصافي ${money(r.net||r.value)}</div>`+field('رقم الفاتورة من النظام المحاسبي','invoiceRef',r.invoiceRef)+area('ملاحظات','notes',r.notes)}else{const ready=DATA.logs.filter(l=>l.projectId===pid&&l.status==='approved');if(!ready.length){toast('لا توجد كميات معتمدة');return}const no='QS-'+String(DATA.statements.filter(s=>s.projectId===pid).length+1).padStart(3,'0');$('#formFields').innerHTML=field('رقم المستخلص *','no',no,'text','required')+field('تاريخ المستخلص *','date',today(),'date','required')+field('من تاريخ','periodFrom',project()?.startDate||today(),'date')+field('إلى تاريخ','periodTo',today(),'date')+`<div class="full banner">سيتم ضم ${ready.length} سجل معتمد وتطبيق الاحتجاز المسجل لكل بند.</div>`+area('ملاحظات','notes')}}
$('#modalTitle').textContent=title;$('#modalNote').textContent='احفظ البيانات الفعلية ويمكن تعديلها لاحقًا.';$('#modal').showModal()}
function closeModal(){$('#modal').close();editing=null}$('#entryForm').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),{type,rid}=editing;if(type==='project'){const old=DATA.projects.find(x=>x.id===rid)||{};const x={...old,id:rid||id(),name:v.name,client:v.client,category:v.category,contractMode:v.contractMode,quoteRef:v.quoteRef,startDate:v.startDate,status:v.status,notes:v.notes};rid?Object.assign(old,x):DATA.projects.push(x)}if(type==='item'){const old=DATA.items.find(x=>x.id===rid)||{};const x={...old,id:rid||id(),projectId:old.projectId||pid,name:v.name,code:v.code,unit:v.unit,price:num(v.price),contractQty:num(v.contractQty),thickness:num(v.thickness),density:num(v.density),tripCapacity:num(v.tripCapacity),retention:num(v.retention),notes:v.notes};rid?Object.assign(old,x):DATA.items.push(x)}if(type==='log'){const old=DATA.logs.find(x=>x.id===rid)||{};const x={...old,id:rid||id(),projectId:old.projectId||pid,itemId:v.itemId,date:v.date,qty:num(v.qty),ticket:v.ticket,status:v.status,notes:v.notes};rid?Object.assign(old,x):DATA.logs.push(x)}if(type==='statement'&&rid){const old=DATA.statements.find(x=>x.id===rid);old.invoiceRef=v.invoiceRef;old.status=v.invoiceRef?'invoiced':'sent';old.notes=v.notes}if(type==='statement'&&!rid){const ready=DATA.logs.filter(l=>l.projectId===pid&&l.status==='approved');let gross=0,retention=0;ready.forEach(l=>{const i=item(l.itemId),line=num(l.qty)*num(i?.price);gross+=line;retention+=line*num(i?.retention)/100});const sid=id();DATA.statements.push({id:sid,projectId:pid,no:v.no,date:v.date,periodFrom:v.periodFrom,periodTo:v.periodTo,gross,retention,net:gross-retention,invoiceRef:'',status:'sent',notes:v.notes,logIds:ready.map(l=>l.id)});ready.forEach(l=>{l.status='billed';l.statementId=sid})}closeModal();await persist();render()}
async function approve(rid,yes){const r=DATA.logs.find(x=>x.id===rid);if(r){r.status=yes?'approved':'pending';await persist();render()}}function openLogFromAny(rid){const r=DATA.logs.find(x=>x.id===rid);pid=r.projectId;openForm('log',rid)}function openStatementFromAny(rid){const r=DATA.statements.find(x=>x.id===rid);pid=r.projectId;openForm('statement',rid)}
async function removeRecord(type,rid){const names={project:'المشروع وكل بياناته',item:'البند',log:'سجل التنفيذ',statement:'المستخلص'};if(!confirm('حذف '+names[type]+' نهائيًا؟'))return;if(type==='project'){DATA.projects=DATA.projects.filter(x=>x.id!==rid);DATA.items=DATA.items.filter(x=>x.projectId!==rid);DATA.logs=DATA.logs.filter(x=>x.projectId!==rid);DATA.statements=DATA.statements.filter(x=>x.projectId!==rid);go('projects')}else DATA[type+'s']=DATA[type+'s'].filter(x=>x.id!==rid);await persist();render()}
