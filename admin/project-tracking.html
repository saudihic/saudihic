 });

function openForm(type,rid,mode=''){editing={type,rid,mode};let r={},title='',note='';if(type==='project'){r=DATA.projects.find(x=>x.id===rid)||{};title=rid?'تعديل المشروع':'مشروع جديد';const category=`<div class="field"><label>نوع المشروع *</label><input name="category" list="projectCategories" value="${esc(r.category||'')}" placeholder="اختر من القائمة أو اكتب نوعًا جديدًا" required><datalist id="projectCategories">${C.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div>`;$('#formFields').innerHTML=field('اسم المشروع *','name',r.name,'text','required')+field('العميل','client',r.client)+category+area('وصف المشروع / نطاق العمل','description',r.description)+select('نوع الاتفاق','contractMode',r.contractMode||'open',[['open','طلبات مفتوحة / فوترة دورية'],['fixed','كمية تعاقدية محددة']])+field('مرجع العرض / أمر الشراء','quoteRef',r.quoteRef)+field('تاريخ البداية','startDate',r.startDate||today(),'date')+select('الحالة','status',r.status||'نشط',['نشط','متوقف','مغلق'])+area('ملاحظات','notes',r.notes)}
if(type==='item'){r=DATA.items.find(x=>x.id===rid)||{};title=rid?'تعديل البند':'إضافة بند تعاقدي';const retentionField=retentionProject(project()?.category)?field('نسبة احتجاز ضمان الأعمال %','retention',r.retention||0,'number','min="0" max="100" step="0.01"'):'<input type="hidden" name="retention" value="0">';$('#formFields').innerHTML=field('اسم البند *','name',r.name,'text','required')+field('كود البند','code',r.code)+select('الوحدة','unit',r.unit||'طن',U)+field('سعر الوحدة لهذا المشروع *','price',r.price,'number','min="0" step="0.01" required')+field('الكمية التعاقدية (0 للمفتوح)','contractQty',r.contractQty||0,'number','min="0" step="0.01"')+field('السماكة سم','thickness',r.thickness||0,'number','min="0" step="0.01"')+field('الكثافة طن/م³','density',r.density||0,'number','min="0" step="0.01"')+field('سعة الرد / التريب','tripCapacity',r.tripCapacity||0,'number','min="0" step="0.01"')+retentionField+area('ملاحظات','notes',r.notes)}
if(type==='log'){r=DATA.logs.find(x=>x.id===rid)||{};const supplyMode=mode==='supply'||(!mode&&view==='supply');title=rid?(supplyMode?'تعديل سجل التوريد':'تعديل سجل التنفيذ'):(supplyMode?'تسجيل توريد أو رد':'تسجيل تنفيذ');const its=DATA.items.filter(i=>i.projectId===pid);if(!its.length){toast('أضف بندًا للمشروع أولًا');return}$('#formFields').innerHTML=select('البند *','itemId',r.itemId||its[0].id,its.map(i=>[i.id,i.name+' — '+i.unit]))+field('التاريخ *','date',r.date||today(),'date','required')+field(supplyMode?'الكمية الموردة *':'الكمية المنفذة *','qty',r.qty,'number','min="0.01" step="0.01" required')+field(supplyMode?'رقم التذكرة / الرد':'رقم التذكرة / المرجع','ticket',r.ticket)+select('حالة الاعتماد','status',r.status||'pending',[['pending','بانتظار الاعتماد'],['approved','معتمد وجاهز للمستخلص']])+area('ملاحظات','notes',r.notes)}
if(type==='purchase'){r=DATA.purchases.find(x=>x.id===rid)||{};title=rid?'تعديل الشراء والاستلام':'شراء واستلام مواد';const its=DATA.items.filter(i=>i.projectId===pid);if(!its.length){toast('أضف بندًا للمشروع أولًا');return}$('#formFields').innerHTML=select('البند *','itemId',r.itemId||its[0].id,its.map(i=>[i.id,i.name+' — '+i.unit]))+field('التاريخ *','date',r.date||today(),'date','required')+field('المورد','supplier',r.supplier)+field('الكمية المشتراة *','purchasedQty',r.purchasedQty,'number','min="0.01" step="0.01" required')+field('الكمية المستلمة *','receivedQty',r.receivedQty??r.purchasedQty,'number','min="0" step="0.01" required')+field('تكلفة الوحدة *','unitCost',r.unitCost,'number','min="0" step="0.01" required')+field('إجمالي قيمة الشراء','total',r.total,'number','min="0" step="0.01" placeholder="يحسب تلقائيًا عند تركه صفرًا"')+field('المبلغ المدفوع فعليًا','paidAmount',r.paidAmount,'number','min="0" step="0.01"')+field('رقم الفاتورة / المرجع','ref',r.ref)+area('ملاحظات','notes',r.notes)}
if(type==='expense'){r=DATA.expenses.find(x=>x.id===rid)||{};title=rid?'تعديل مصروف المشروع':'إضافة مصروف للمشروع';$('#formFields').innerHTML=field('التاريخ *','date',r.date||today(),'date','required')+select('نوع المصروف *','category',r.category||'transport',[['transport','نقل'],['equipment','معدات'],['labor','عمالة'],['other','أخرى']])+field('البيان *','description',r.description,'text','required')+field('قيمة المصروف *','amount',r.amount,'number','min="0" step="0.01" required')+field('المبلغ المدفوع فعليًا','paidAmount',r.paidAmount,'number','min="0" step="0.01"')+field('رقم الفاتورة / المرجع','ref',r.ref)+area('ملاحظات','notes',r.notes)}
if(type==='receipt'){r=DATA.receipts.find(x=>x.id===rid)||{};title=rid?'تعديل تحصيل العميل':'تسجيل تحصيل من العميل';$('#formFields').innerHTML=field('التاريخ *','date',r.date||today(),'date','required')+field('المبلغ المحصل *','amount',r.amount,'number','min="0.01" step="0.01" required')+field('رقم السند / المرجع','ref',r.ref)+area('ملاحظات','notes',r.notes)}

function closeModal(){$('#modal').close();editing=null}$('#entryForm').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),{type,rid,nextType}=editing;if(type==='chooseProject'){pid=v.projectId;closeModal();openForm(nextType);return}if(type==='project'){const old=DATA.projects.find(x=>x.id===rid)||{};const x={...old,id:rid||id(),name:v.name,client:v.client,category:v.category,description:v.description,contractMode:v.contractMode,quoteRef:v.quoteRef,startDate:v.startDate,status:v.status,notes:v.notes};rid?Object.assign(old,x):DATA.projects.push(x)}if(type==='item'){const old=DATA.items.find(x=>x.id===rid)||{};const x={...old,id:rid||id(),projectId:old.projectId||pid,name:v.name,code:v.code,unit:v.unit,price:num(v.price),contractQty:num(v.contractQty),thickness:num(v.thickness),density:num(v.density),tripCapacity:num(v.tripCapacity),retention:retentionProject(project()?.category)?num(v.retention):0,notes:v.notes};rid?Object.assign(old,x):DATA.items.push(x)}if(type==='log'){const old=DATA.logs.find(x=>x.id===rid)||{};const x={...old,id:rid||id(),projectId:old.projectId||pid,itemId:v.itemId,date:v.date,qty:num(v.qty),ticket:v.ticket,status:v.status,notes:v.notes};rid?Object.assign(old,x):DATA.logs.push(x)}if(type==='purchase'){const old=DATA.purchases.find(x=>x.id===rid)||{},purchasedQty=num(v.purchasedQty),unitCost=num(v.unitCost);const x={...old,id:rid||id(),projectId:old.projectId||pid,itemId:v.itemId,date:v.date,supplier:v.supplier,purchasedQty,receivedQty:num(v.receivedQty),unitCost,total:num(v.total)||purchasedQty*unitCost,paidAmount:num(v.paidAmount),ref:v.ref,notes:v.notes};rid?Object.assign(old,x):DATA.purchases.push(x)}if(type==='expense'){const old=DATA.expenses.find(x=>x.id===rid)||{};const x={...old,id:rid||id(),projectId:old.projectId||pid,date:v.date,category:v.category,description:v.description,amount:num(v.amount),paidAmount:num(v.paidAmount),ref:v.ref,notes:v.notes};rid?Object.assign(old,x):DATA.expenses.push(x)}if(type==='receipt'){const old=DATA.receipts.find(x=>x.id===rid)||{};const x={...old,id:rid||id(),projectId:old.projectId||pid,date:v.date,amount:num(v.amount),ref:v.ref,notes:v.notes};rid?Object.assign(old,x):DATA.receipts.push(x)}if(type==='statement'&&rid){const old=DATA.statements.find(x=>x.id===rid);old.invoiceRef=v.invoiceRef;old.status=v.invoiceRef?'invoiced':'sent';old.notes=v.notes}if(type==='statement'&&!rid){const ready=DATA.logs.filter(l=>l.projectId===pid&&l.status==='approved');let gross=0,retention=0,allowRetention=retentionProject(project()?.category);ready.forEach(l=>{const i=item(l.itemId),line=num(l.qty)*num(i?.price);gross+=line;if(allowRetention)retention+=line*num(i?.retention)/100});const sid=id();DATA.statements.push({id:sid,projectId:pid,no:v.no,date:v.date,periodFrom:v.periodFrom,periodTo:v.periodTo,gross,retention,net:gross-retention,invoiceRef:'',status:'sent',notes:v.notes,logIds:ready.map(l=>l.id)});ready.forEach(l=>{l.status='billed';l.statementId=sid})}closeModal();await persist();render()}
async function approve(rid,yes){const r=DATA.logs.find(x=>x.id===rid);if(r){r.status=yes?'approved':'pending';await persist();render()}}function openLogFromAny(rid){const r=DATA.logs.find(x=>x.id===rid);pid=r.projectId;openForm('log',rid,view==='supply'?'supply':'execution')}function openStatementFromAny(rid){const r=DATA.statements.find(x=>x.id===rid);pid=r.projectId;openForm('statement',rid)}
