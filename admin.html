<script>

async function uploadImageForField(key, fileInput){

  const file = fileInput.files && fileInput.files[0];

  if(!file){
    alert('اختر صورة أولاً');
    return;
  }

  const form = new FormData();

  form.append('password', adminPassword);
  form.append('file', file);

  try{

    showStatus('جاري رفع الصورة...');

    const r = await fetch('/api/media', {
      method: 'POST',
      body: form
    });

    const result = await r.json();

    if(!r.ok || !(result.ok || result.success)){
      throw new Error(result.error || 'Image upload failed');
    }

    // تنظيف الرابط تلقائياً
    let imagePath = '/' + String(result.path || result.url || '')
      .replace(/^\/+/, '')
      .replace(/\/+$/, '');

    // إنشاء العنصر إذا غير موجود
    if (!data.pages[currentPage].images[key]) {
      data.pages[currentPage].images[key] = {};
    }

    // حفظ المسار
    data.pages[currentPage].images[key].src = imagePath;

    // إعادة رسم الصفحة
    renderCurrent();

    showStatus('تم رفع الصورة وتحديث المسار — اضغط حفظ مباشر لاعتماد التغيير');

  }catch(e){

    showStatus('فشل رفع الصورة: ' + e.message, false);

  }

}

</script>
